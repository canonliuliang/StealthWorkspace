name: Website checks
on:
  pull_request:
    paths: ['website/**', 'Services/AppInfo.cs', 'tools/site.mjs', 'tools/release-readiness*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tools/site.mjs check
      - run: node --test tools/release-readiness.test.mjs
