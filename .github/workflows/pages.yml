name: Official website
on:
  push:
    branches: [main]
    paths: ['website/**', 'tools/site.mjs', 'tools/release-readiness*', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      release-ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tools/site.mjs build
      - run: node --test tools/release-readiness.test.mjs
      - name: Check published downloads before exposing download buttons
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/site.mjs release-ready
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.release.outputs.ready == 'true'
        with:
          path: website/dist
  deploy:
    needs: build
    if: needs.build.outputs.release-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
